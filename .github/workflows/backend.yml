name: backend

on:
  push:
    branches: ["**"]
    paths:
      - "backend/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/deploy-backend-production.sh"
      - "scripts/verify-app-store.mjs"
      - "scripts/tests/verify-app-store.test.mjs"
      - "backend/wrangler.example.jsonc"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: [self-hosted, macOS, ARM64, afterimage-ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, macOS, ARM64, afterimage-ci]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - name: Deploy backend to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AFTERIMAGE_PRODUCTION_WRANGLER_CONFIG: ${{ secrets.AFTERIMAGE_PRODUCTION_WRANGLER_CONFIG }}
          D1_DATABASE: DB
          PRODUCTION_ORIGIN: https://afterimage.2-38.com
          DEPLOY_MESSAGE: "afterimage backend production ${{ github.sha }}"
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not configured"
            exit 1
          fi
          if [[ -z "${AFTERIMAGE_PRODUCTION_WRANGLER_CONFIG:-}" ]]; then
            echo "::error::AFTERIMAGE_PRODUCTION_WRANGLER_CONFIG is not configured"
            exit 1
          fi
          if [[ -z "${RUNNER_TEMP:-}" || -z "${GITHUB_WORKSPACE:-}" ]]; then
            echo "::error::RUNNER_TEMP and GITHUB_WORKSPACE are required"
            exit 1
          fi
          CONFIG_DIR="$(mktemp -d "${RUNNER_TEMP%/}/afterimage-wrangler.XXXXXX")"
          CONFIG_PATH="$CONFIG_DIR/wrangler.jsonc"
          cleanup() {
            if [[ "$CONFIG_DIR" == "${RUNNER_TEMP%/}"/afterimage-wrangler.* ]]; then
              rm -rf -- "$CONFIG_DIR"
            fi
          }
          trap cleanup EXIT
          trap 'cleanup; exit 130' INT
          trap 'cleanup; exit 143' TERM
          printf '%s' "$AFTERIMAGE_PRODUCTION_WRANGLER_CONFIG" > "$CONFIG_PATH"
          chmod 600 "$CONFIG_PATH"
          node --input-type=module - "$CONFIG_PATH" "$GITHUB_WORKSPACE/backend" <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          import path from "node:path";

          const [configPath, backendRoot] = process.argv.slice(2);
          const source = readFileSync(configPath, "utf8");
          const mainMarker = '"main": "src/index.ts"';
          const migrationsMarker = '"migrations_dir": "migrations"';
          if (!source.includes(mainMarker) || !source.includes(migrationsMarker)) {
            throw new Error("production Wrangler config must contain the expected relative main and migrations paths");
          }
          const mainPath = JSON.stringify(path.join(backendRoot, "src", "index.ts"));
          const migrationsPath = JSON.stringify(path.join(backendRoot, "migrations"));
          const updated = source
            .replace(mainMarker, `"main": ${mainPath}`)
            .replace(migrationsMarker, `"migrations_dir": ${migrationsPath}`);
          writeFileSync(configPath, updated);
          NODE
          export WRANGLER_CONFIG="$CONFIG_PATH"
          ./scripts/deploy-backend-production.sh
