name: ios-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, macOS, ARM64, afterimage-ci]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Verify iOS source and localization contracts
        run: |
          node scripts/verify-ios-contract.mjs
          node scripts/verify-ios-localizations.mjs
      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null; then
            brew untap aws/tap 2>/dev/null || true
            brew install xcodegen
          fi
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Select iOS 26 simulator
        id: simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; payload=json.load(sys.stdin); print(next(device["udid"] for runtime, devices in payload["devices"].items() if "iOS-26" in runtime for device in devices if device.get("isAvailable") and device["name"].startswith("iPhone")))')
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
      - name: Build and test
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test \
            -project afterimage.xcodeproj \
            -scheme afterimage \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath DerivedData \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -jobs 1 \
            -collect-test-diagnostics never \
            CODE_SIGNING_ALLOWED=NO \
            CC="$GITHUB_WORKSPACE/scripts/xcode-clang-probe" \
            | tee xcodebuild.log

  deploy:
    needs: test
    runs-on: [self-hosted, macOS, ARM64, afterimage-ci]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null; then
            brew untap aws/tap 2>/dev/null || true
            brew install xcodegen
          fi
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Prepare temporary App Store Connect API key
        id: asc_key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          KEY_DIR=$(mktemp -d "$RUNNER_TEMP/afterimage-asc.XXXXXX")
          KEY_PATH="$KEY_DIR/AuthKey.p8"
          printf '%s' "$ASC_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "dir=$KEY_DIR" >> "$GITHUB_OUTPUT"
          echo "path=$KEY_PATH" >> "$GITHUB_OUTPUT"
      - name: Configure isolated signing keychain
        id: signing_keychain
        env:
          CI_KEYCHAIN_PASSWORD: ${{ secrets.AFTERIMAGE_CI_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$HOME/actions-runner-afterimage/.ci/afterimage-ci.keychain-db"
          test -f "$KEYCHAIN"
          security unlock-keychain -p "$CI_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security default-keychain -d user -s "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          echo "path=$KEYCHAIN" >> "$GITHUB_OUTPUT"
      - name: Archive
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project afterimage.xcodeproj \
            -scheme afterimage \
            -configuration Release \
            -archivePath build/afterimage.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.asc_key.outputs.path }}" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            OTHER_CODE_SIGN_FLAGS="--keychain ${{ steps.signing_keychain.outputs.path }}" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CC="$GITHUB_WORKSPACE/scripts/xcode-clang-probe" \
            | tee archive.log
      - name: Export and upload to TestFlight
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/afterimage.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.asc_key.outputs.path }}" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee export.log
      - name: Verify upload
        working-directory: ios
        run: |
          if [ ! -d build/export/afterimage.ipa ] && [ ! -f build/export/afterimage.ipa ]; then
            # export with destination=upload may not leave an IPA; check logs instead
            grep -qi 'upload' export.log || { echo "ERROR: no upload evidence in export.log"; exit 1; }
          fi
          echo "TestFlight upload completed (build ${{ github.run_number }})"
      - name: Remove temporary App Store Connect API key
        if: always()
        env:
          KEY_DIR: ${{ steps.asc_key.outputs.dir }}
        run: |
          if [ -n "$KEY_DIR" ]; then
            rm -rf "$KEY_DIR"
          fi
      - name: Restore login keychain
        if: always()
        env:
          CI_KEYCHAIN: ${{ steps.signing_keychain.outputs.path }}
        run: |
          LOGIN_KEYCHAIN="$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -d user -s "$LOGIN_KEYCHAIN"
          security list-keychains -d user -s "$LOGIN_KEYCHAIN"
          if [ -n "$CI_KEYCHAIN" ]; then
            security lock-keychain "$CI_KEYCHAIN" 2>/dev/null || true
          fi
