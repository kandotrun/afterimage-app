name: ios

on:
  push:
    branches: ["**"]
    paths:
      - "ios/**"
      - "docs/app-store/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/fixtures/app-store/**"
      - "scripts/tests/verify-app-store.test.mjs"
      - "scripts/tests/test_verify_ios_archive.py"
      - "scripts/verify-app-store.mjs"
      - "scripts/verify-ios-archive.py"
      - "scripts/generate-app-store-screenshots.sh"
      - "scripts/verify-ios-contract.mjs"
      - "scripts/verify-ios-haptics.mjs"
      - "scripts/verify-ios-pr37-port-contract.mjs"
      - "scripts/verify-ios-pr39-port-contract.mjs"
      - "scripts/verify-ios-localizations.mjs"
      - "scripts/xcode-clang-probe"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, macOS, ARM64, afterimage-ci]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - name: Verify iOS and App Store contracts
        run: |
          npm run check:ios
          node scripts/verify-app-store.mjs \
            --mode contracts \
            --report ios/AppStoreContract.json
      - name: Verify XcodeGen
        run: |
          command -v xcodegen
          xcodegen --version
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Select iOS 26 simulator
        id: simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; payload=json.load(sys.stdin); print(next(device["udid"] for runtime, devices in payload["devices"].items() if "iOS-26" in runtime for device in devices if device.get("isAvailable") and device["name"].startswith("iPhone")))')
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          xcodebuild -version
      - name: Build and test
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test \
            -project afterimage.xcodeproj \
            -scheme afterimage \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -jobs 1 \
            -collect-test-diagnostics never \
            CODE_SIGNING_ALLOWED=NO \
            CC="$GITHUB_WORKSPACE/scripts/xcode-clang-probe" \
            | tee xcodebuild.log
      - name: Verify bundled privacy manifest
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          products = Path("ios/DerivedData/Build/Products")
          apps = sorted(products.rglob("*.app"))
          manifests = sorted(app / "PrivacyInfo.xcprivacy" for app in apps if (app / "PrivacyInfo.xcprivacy").is_file())
          print("app bundles:", [str(path) for path in apps])
          print("privacy manifests:", [str(path) for path in manifests])
          if len(manifests) != 1:
              raise SystemExit(f"expected exactly one bundled privacy manifest, found {len(manifests)}")
          with manifests[0].open("rb") as handle:
              privacy = plistlib.load(handle)
          if privacy.get("NSPrivacyTracking") is not False:
              raise SystemExit("bundled privacy manifest must declare tracking=false")
          accessed = {
              item["NSPrivacyAccessedAPIType"]: item["NSPrivacyAccessedAPITypeReasons"]
              for item in privacy.get("NSPrivacyAccessedAPITypes", [])
          }
          if "CA92.1" not in accessed.get("NSPrivacyAccessedAPICategoryUserDefaults", []):
              raise SystemExit("bundled privacy manifest must declare UserDefaults CA92.1")
          print("bundled privacy manifest: PASS")
          PY
      - name: Upload iOS verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: afterimage-ios-evidence
          path: |
            ios/TestResults.xcresult
            ios/xcodebuild.log
            ios/AppStoreContract.json
          if-no-files-found: ignore
          retention-days: 7
