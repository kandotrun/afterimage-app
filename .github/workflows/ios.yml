name: ios

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "scripts/verify-ios-contract.mjs"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "scripts/verify-ios-contract.mjs"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify iOS source contract
        run: node scripts/verify-ios-contract.mjs
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Select iOS 26 simulator
        id: simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; payload=json.load(sys.stdin); print(next(device["udid"] for runtime, devices in payload["devices"].items() if "iOS-26" in runtime for device in devices if device.get("isAvailable") and device["name"].startswith("iPhone")))')
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          xcodebuild -version
      - name: Build and test
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test \
            -project afterimage.xcodeproj \
            -scheme afterimage \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log
      - name: Upload Xcode result bundle
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: afterimage-xcresult
          path: ios/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7
