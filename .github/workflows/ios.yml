name: ios

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "scripts/verify-ios-contract.mjs"
      - "scripts/verify-ios-localizations.mjs"
      - "scripts/xcode-clang-probe"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - "scripts/verify-ios-contract.mjs"
      - "scripts/verify-ios-localizations.mjs"
      - "scripts/xcode-clang-probe"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, macOS, ARM64, afterimage-ci]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Verify iOS source and localization contracts
        run: |
          node scripts/verify-ios-contract.mjs
          node scripts/verify-ios-localizations.mjs
      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null; then
            brew untap aws/tap 2>/dev/null || true
            brew install xcodegen
          fi
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Select iOS 26 simulator
        id: simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; payload=json.load(sys.stdin); print(next(device["udid"] for runtime, devices in payload["devices"].items() if "iOS-26" in runtime for device in devices if device.get("isAvailable") and device["name"].startswith("iPhone")))')
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          xcodebuild -version
      - name: Build and test
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test \
            -project afterimage.xcodeproj \
            -scheme afterimage \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -jobs 1 \
            -collect-test-diagnostics never \
            CODE_SIGNING_ALLOWED=NO \
            CC="$GITHUB_WORKSPACE/scripts/xcode-clang-probe" \
            | tee xcodebuild.log
      - name: Verify bundled privacy manifest
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          products = Path("ios/DerivedData/Build/Products")
          apps = sorted(products.rglob("*.app"))
          manifests = sorted(app / "PrivacyInfo.xcprivacy" for app in apps if (app / "PrivacyInfo.xcprivacy").is_file())
          print("app bundles:", [str(path) for path in apps])
          print("privacy manifests:", [str(path) for path in manifests])
          if len(manifests) != 1:
              raise SystemExit(f"expected exactly one bundled privacy manifest, found {len(manifests)}")
          with manifests[0].open("rb") as handle:
              privacy = plistlib.load(handle)
          if privacy.get("NSPrivacyTracking") is not False:
              raise SystemExit("bundled privacy manifest must declare tracking=false")
          print("bundled privacy manifest: PASS")
          PY
      - name: Upload Xcode result bundle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: afterimage-xcresult
          path: ios/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7
