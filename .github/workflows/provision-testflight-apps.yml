name: Provision TestFlight Apps

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provision-testflight-apps
  cancel-in-progress: false

jobs:
  provision:
    runs-on: [self-hosted, macOS, ARM64, afterimage-ci]
    timeout-minutes: 15
    steps:
      - name: Check out trusted provisioning script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Prepare App Store Connect key
        shell: bash
        env:
          ASC_ISSUER_ID_VALUE: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID_VALUE: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_VALUE: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$ASC_ISSUER_ID_VALUE" ]]
          [[ -n "$ASC_KEY_ID_VALUE" ]]
          [[ -n "$ASC_PRIVATE_KEY_VALUE" ]]
          API_KEY_DIR=$(mktemp -d "$RUNNER_TEMP/testflight-provision.XXXXXX")
          API_KEY_PATH="$API_KEY_DIR/AuthKey_${ASC_KEY_ID_VALUE}.p8"
          {
            echo "API_KEY_DIR=$API_KEY_DIR"
            echo "ASC_KEY_PATH=$API_KEY_PATH"
            echo "ASC_ISSUER_ID=$ASC_ISSUER_ID_VALUE"
            echo "ASC_KEY_ID=$ASC_KEY_ID_VALUE"
          } >> "$GITHUB_ENV"
          printf '%s' "$ASC_PRIVATE_KEY_VALUE" > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"

      - name: Ensure TestFlight app records
        shell: bash
        run: |
          set -euo pipefail
          FASTLANE_PREFIX=$(brew --prefix fastlane)
          RUBY_BIN="$(brew --prefix ruby)/bin/ruby"
          GEM_PATH="$FASTLANE_PREFIX/libexec" "$RUBY_BIN" scripts/provision_testflight_apps.rb

      - name: Remove temporary App Store Connect key
        if: always()
        shell: bash
        run: |
          set +e
          case "${API_KEY_DIR:-}" in
            "$RUNNER_TEMP"/testflight-provision.*)
              find "$API_KEY_DIR" -type f -delete
              rmdir "$API_KEY_DIR"
              ;;
            "") ;;
            *) exit 1 ;;
          esac
