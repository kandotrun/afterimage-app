name: afterimage
options:
  bundleIdPrefix: com.2-38
  developmentLanguage: ja
  knownRegions:
    - ja
    - en
    - zh-Hans
    - ko
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: UGNVGWZMAU
    DEVELOPMENT_LANGUAGE: ja
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  afterimage:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Resources/Localization
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: afterimage
        PRODUCT_MODULE_NAME: afterimage
        PRODUCT_BUNDLE_IDENTIFIER: com.2-38.afterimage
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/afterimage.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: AfterimageUploadWidget
  AfterimageUploadWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: AfterimageUploadWidget
        excludes:
          - Localization
      - path: Sources/Shared
      - path: AfterimageUploadWidget/Localization
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: AfterimageUploadWidget
        PRODUCT_MODULE_NAME: AfterimageUploadWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.2-38.afterimage.upload-widget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: AfterimageUploadWidget/Info.plist
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
  afterimageTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: afterimage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.2-38.afterimage.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/afterimage.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/afterimage"
        BUNDLE_LOADER: "$(TEST_HOST)"
  afterimageUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: afterimage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.2-38.afterimage.ui-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: afterimage
schemes:
  afterimage:
    build:
      targets:
        afterimage: all
        afterimageTests: [test]
        afterimageUITests: [test]
    test:
      targets:
        - afterimageTests
        - afterimageUITests
