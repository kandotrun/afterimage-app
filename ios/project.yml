name: afterimage
options:
  bundleIdPrefix: com.kandotrun
  deploymentTarget:
    iOS: "26.0"
  fileTypes:
    xcprivacy:
      buildPhase: resources
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_LANGUAGE: ja
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  afterimage:
    type: application
    platform: iOS
    sources:
      - Sources
    resources:
      - Resources/Assets.xcassets
      - Resources/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_NAME: afterimage
        PRODUCT_MODULE_NAME: afterimage
        PRODUCT_BUNDLE_IDENTIFIER: com.kandotrun.afterimage
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/afterimage.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies: []
  afterimageTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: afterimage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kandotrun.afterimage.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/afterimage.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/afterimage"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  afterimage:
    build:
      targets:
        afterimage: all
        afterimageTests: [test]
    test:
      targets:
        - afterimageTests
